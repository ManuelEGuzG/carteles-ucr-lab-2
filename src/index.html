<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carteles UCR</title>
  <link rel="stylesheet" href="global.css" />
</head>
<body>

  <div class="pagina">

    <!-- CARTEL 1: Directorio -->
    <div class="cartel-directorio">
      <div class="filas">
        <div class="fila"><span>Aulas 5, 6, 7</span><span>→</span></div>
        <div class="fila"><span>Apoyo Informático</span><span>→</span></div>
        <div class="fila"><span>Servidores</span><span>→</span></div>
        <div class="fila"><span>Laboratorio 1 y 2</span><span>→</span></div>
        <div class="fila"><span>Coordinación<br>Informática Empresarial</span><span>→</span></div>
      </div>
      <div class="footer-directorio">
        <img src="logo-ucr.png" alt="Logo UCR" class="logo-ucr">
      </div>
    </div>

    <!-- CARTEL 2: Anti-acoso -->
    <div class="poster">

      <!-- Parte superior: badges + texto + QR -->
      <div class="poster-top">

        <div class="badges">
          <div class="badges-fila1">
            <span class="exclamacion izq">¡</span>
            <span class="badge cyan">LA SEDE</span>
          </div>
          <div class="badges-fila2">
            <span class="badge blanco">TE</span>
            <span class="badge morado">ACOMPAÑA</span>
            <span class="exclamacion der">!</span>
          </div>
        </div>

        <p class="subtitulo">El respeto no se negocia</p>
        <p class="titulo-grande">¡Pará ya de acosar!</p>



      </div>

      <!-- Parte inferior: personas -->
      <div class="personas">
        <img src="personas.png" alt="Personas" class="personas-img">
      </div>

      <!-- Footer -->
      <div class="footer-poster">
        <img src="logo-ucr.png" alt="UCR" class="logo-ucr-footer">
        <span class="separador"></span>
        <div class="acoso-bloque">
          <span class="acoso-ucr">UCR</span>
          <span class="acoso-texto">LIBRE DE<br>ACOSO SEXUAL</span>
        </div>
        <span class="separador"></span>
        <div class="sg-bloque">
          <span class="sg-letras">SG</span>
          <span class="sg-texto">Sede de<br>Guanacaste</span>
        </div>
      </div>

    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
